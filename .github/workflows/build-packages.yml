name: Build Serenity Packages

# Manual trigger only (incremental build by default)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode: only missing/updated packages, or rebuild all"
        required: true
        default: "missing-or-updated"
        type: choice
        options:
          - missing-or-updated
          - all
      packages:
        description: "Optional comma-separated package names (e.g. cosmic-settings-daemon,cosmic-applets)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: pkgs-v1

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      has_packages: ${{ steps.list.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/index.json
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, tomllib, urllib.request

          all_recipes = {
              p.parent.name: tomllib.loads(p.read_text(encoding="utf-8"))
              for p in sorted(pathlib.Path("packages").glob("*/recipe.toml"))
          }

          explicit = [s.strip() for s in os.environ.get("INPUT_PACKAGES", "").split(",") if s.strip()]
          mode = os.environ.get("INPUT_MODE", "missing-or-updated")

          if explicit:
              selected = [p for p in explicit if p in all_recipes]
          elif mode == "all":
              selected = sorted(all_recipes.keys())
          else:
              existing = {}
              try:
                  req = urllib.request.Request(os.environ["INDEX_URL"], headers={"User-Agent": "serenity-ci"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      existing = json.loads(resp.read().decode("utf-8")).get("packages", {})
              except Exception:
                  existing = {}

              selected = []
              for name, recipe in sorted(all_recipes.items()):
                  pkg = recipe["package"]
                  cur = existing.get(name)
                  if (
                      cur is None
                      or cur.get("version") != pkg.get("version")
                      or cur.get("deps", []) != pkg.get("deps", [])
                  ):
                      selected.append(name)

          print(f"packages={json.dumps(selected)}")
          print(f"has_packages={'true' if selected else 'false'}")
          PY
          echo "Selected packages to build: $(cat "$GITHUB_OUTPUT")"

  build:
    needs: discover
    if: needs.discover.outputs.has_packages == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies for ${{ matrix.package }}
        run: |
          SRC_TYPE="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["source"]["type"])' "packages/${{ matrix.package }}/recipe.toml")"
          echo "Package '${{ matrix.package }}' has source.type=${SRC_TYPE}"
          case "${SRC_TYPE}" in
            deb|prebuilt|meta)
              echo "Lightweight repack — only zstd & binutils needed (already pre-installed)."
              command -v zstd >/dev/null && command -v ar >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd binutils)
              ;;
            syslibs)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                zstd locales libc-bin libgtk-3-0t64 libgtk-3-common gsettings-desktop-schemas shared-mime-info \
                libgdk-pixbuf-2.0-0 librsvg2-common bubblewrap \
                libsecret-1-0 libnotify4 \
                libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
                libcairo2 libpango-1.0-0 libcups2t64 libasound2t64 libxcomposite1 \
                libxdamage1 libxfixes3 libxrandr2 libxi6 libxres1 libavahi-client3
              sudo apt-get install -y --no-install-recommends glycin-loaders || true
              sudo glib-compile-schemas /usr/share/glib-2.0/schemas || true
              sudo update-mime-database /usr/share/mime || true
              sudo mkdir -p /usr/lib/locale
              sudo localedef --no-archive -i en_US -c -f UTF-8 -A /usr/share/locale/locale.alias en_US.UTF-8
              sudo localedef --no-archive -i vi_VN -c -f UTF-8 -A /usr/share/locale/locale.alias vi_VN.UTF-8
              ;;
            custom)
              if [ "${{ matrix.package }}" = "rust" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd clang lld llvm musl-dev
              elif [ "${{ matrix.package }}" = "screenshot" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd git gcc meson ninja-build pkg-config \
                  libwayland-dev libpixman-1-dev libpng-dev libjpeg-dev \
                  slurp wl-clipboard
              elif [ "${{ matrix.package }}" = "pipewire" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd pipewire pipewire-bin pipewire-pulse pipewire-alsa wireplumber \
                  alsa-ucm-conf alsa-utils libspa-0.2-modules
              elif [ "${{ matrix.package }}" = "tzdata" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd tzdata
              elif [ "${{ matrix.package }}" = "xwayland" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd xwayland x11-xkb-utils xauth
              elif [ "${{ matrix.package }}" = "lib32" ]; then
                sudo dpkg --add-architecture i386
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd libc6:i386 libstdc++6:i386 libgcc-s1:i386 zlib1g:i386 \
                  libgl1:i386 libglx-mesa0:i386 libegl1:i386 libegl-mesa0:i386 \
                  libgl1-mesa-dri:i386 mesa-vulkan-drivers:i386 libvulkan1:i386 \
                  libgbm1:i386 libdrm2:i386 libdrm-intel1:i386 libdrm-amdgpu1:i386 \
                  libx11-6:i386 libxext6:i386 libxfixes3:i386 libxi6:i386 \
                  libxrandr2:i386 libxrender1:i386 libxtst6:i386 libxcb1:i386 \
                  libxcb-dri3-0:i386 libxcb-present0:i386 libxcb-glx0:i386 libxcb-shm0:i386 \
                  libxshmfence1:i386 libxxf86vm1:i386 libwayland-client0:i386 \
                  libpulse0:i386 libasound2t64:i386 libnss3:i386 libnspr4:i386 \
                  libdbus-1-3:i386 libudev1:i386 libexpat1:i386 libffi8:i386 \
                  libgpg-error0:i386 libgcrypt20:i386
                sudo apt-get install -y --no-install-recommends \
                  libcurl4t64:i386 libnm0:i386 libpipewire-0.3-0t64:i386 || true
              elif [ "${{ matrix.package }}" = "steam" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd binutils curl grep sed gawk findutils tar xz-utils gzip procps file \
                  diffutils util-linux libc-bin
              elif [ "${{ matrix.package }}" = "serenity-base" ]; then
                # Everything scripts/bundle-compositor.sh copies into the rootfs comes from
                # THIS pinned runner image, so glibc/Mesa/NM match every other package.
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd clang lld pkg-config cmake \
                  libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libinput-dev libudev-dev \
                  libseat-dev libpixman-1-dev libfontconfig-dev libfreetype-dev libssl-dev \
                  libdbus-1-dev libdisplay-info-dev libegl-dev libgles-dev libvulkan-dev \
                  libegl1 libgles2 libegl-mesa0 libgbm1 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 \
                  libwayland-client0 libwayland-server0 libwayland-egl1 libwayland-cursor0 \
                  libxkbcommon0 libdisplay-info1 libseat1 libpixman-1-0 libdav1d7 \
                  libfontconfig1 libfreetype6 libsystemd0 libpipewire-0.3-0t64 libpulse0 \
                  dbus-daemon dbus-bin seatd network-manager wpasupplicant netplan.io \
                  dash bash tzdata locales libc-bin libcrypt1
                sudo mkdir -p /usr/lib/locale
                sudo localedef --no-archive -i en_US -c -f UTF-8 -A /usr/share/locale/locale.alias en_US.UTF-8
                sudo localedef --no-archive -i vi_VN -c -f UTF-8 -A /usr/share/locale/locale.alias vi_VN.UTF-8
                rustup target add x86_64-unknown-linux-musl
              elif [ "${{ matrix.package }}" = "pop-launcher" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd git pkg-config libxkbcommon-dev libegl-dev libssl-dev
              elif [ "${{ matrix.package }}" = "linux" ]; then
                # Full distro-config kernel build needs ~15 GB: drop preinstalled SDKs first.
                sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
                df -h /
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd build-essential bc bison flex libelf-dev libssl-dev \
                  cpio rsync kmod xz-utils python3 curl dpkg-dev
              elif [ "${{ matrix.package }}" = "kmod" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd kmod
              elif [ "${{ matrix.package }}" = "linux-firmware" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd git make rdfind parallel python3 curl rsync
              elif [ "${{ matrix.package }}" = "nvm" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd curl ca-certificates xz-utils tar gzip gawk grep sed
              elif [ "${{ matrix.package }}" = "claude" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd curl ca-certificates tar gzip
              elif [ "${{ matrix.package }}" = "cloudflare-warp" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd binutils curl ca-certificates iproute2 nftables \
                  libpcap0.8 libtss2-esys-3.0.2-0t64 libtss2-tctildr0t64 \
                  libnss3-tools lsof util-linux net-tools libcap2-bin
              elif [ "${{ matrix.package }}" = "eog" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd eog libgtk-3-0t64 gsettings-desktop-schemas webp-pixbuf-loader librsvg2-common libglib2.0-bin
              elif [ "${{ matrix.package }}" = "guvcview" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd guvcview v4l-utils libgtk-3-0t64 libsdl2-2.0-0 libv4l-0t64
              elif [ "${{ matrix.package }}" = "libreoffice" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  zstd binutils curl ca-certificates tar xz-utils gzip \
                  libsm6 libice6 libxinerama1 libxrender1 libx11-6 libxext6 libxt6t64 libxrandr2 \
                  libgtk-3-0t64 libcairo2 libpango-1.0-0 libatk1.0-0t64 libgdk-pixbuf-2.0-0 \
                  libfontconfig1 libfreetype6 libdbus-1-3 libdbus-glib-1-2 libcups2t64 \
                  libgl1 libegl1 libnss3 libnspr4 libxslt1.1 libxml2 libkrb5-3 libgssapi-krb5-2
              elif [ "${{ matrix.package }}" = "python" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd curl ca-certificates tar gzip \
                  libc6 ncurses-base ncurses-term
              elif [ "${{ matrix.package }}" = "uv" ]; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends zstd curl ca-certificates tar gzip
              else
                command -v zstd >/dev/null && command -v git >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd git)
              fi
              ;;
            cargo|cargo-gnu)
              sudo apt-get update
              sudo apt-get install -y \
                zstd clang lld libclang-dev pkg-config just cmake nasm \
                libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev \
                libinput-dev libudev-dev libseat-dev libpixman-1-dev \
                libfontconfig-dev libfreetype-dev libssl-dev libexpat1-dev \
                libdav1d-dev libdbus-1-dev libdisplay-info-dev libpulse-dev libpipewire-0.3-dev \
                libglib2.0-dev \
                libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              rustup target add x86_64-unknown-linux-musl
              ;;
          esac

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.package }}-${{ hashFiles('packages/**/recipe.toml') }}
          restore-keys: |
            cargo-${{ matrix.package }}-
            cargo-

      - name: Build ${{ matrix.package }} (.tar.zst + metadata)
        run: |
          python3 scripts/build-package.py \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}" \
            --out-dir build/packages \
            --write-meta \
            "${{ matrix.package }}"

      - name: Upload built package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}
          path: |
            build/packages/*.tar.zst
            build/packages/*.meta.json

  publish:
    needs: [discover, build]
    if: always() && needs.discover.outputs.has_packages == 'true' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download newly built package artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: build/artifacts
          merge-multiple: true

      - name: Fetch existing index.json from Release (preserve previous packages)
        run: |
          mkdir -p build/artifacts
          curl -fL "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/index.json" \
            -o build/existing-index.json || echo '{"version":1,"packages":{}}' > build/existing-index.json

      - name: Merge newly built packages into index.json
        run: |
          python3 scripts/build-package.py \
            --merge-meta-dir build/artifacts \
            --base-index build/existing-index.json \
            --out-dir build/artifacts
          cat build/artifacts/index.json

      - name: Publish updated packages and index.json to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Serenity Linux Packages (${{ env.RELEASE_TAG }})"
          body: |
            Automated Serenity Linux packages (x86_64-musl + COSMIC Desktop + Alacritty).
            Point `/etc/spkg/repo.json` to:
            `https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/index.json`
          files: |
            build/artifacts/*.tar.zst
            build/artifacts/index.json
