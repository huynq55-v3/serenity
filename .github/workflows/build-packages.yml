name: Build Serenity Packages

on:
  push:
    branches: [main, master]
    paths:
      - "packages/**"
      - "scripts/build-package.py"
      - ".github/workflows/build-packages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: pkgs-v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust musl target & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd clang
          rustup target add x86_64-unknown-linux-musl

      - name: Build .tar.zst packages and index.json
        run: |
          python3 scripts/build-package.py \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}" \
            --out-dir build/packages

      - name: Publish packages and index.json to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Serenity Linux Packages (${{ env.RELEASE_TAG }})"
          body: |
            Automated x86_64-musl static packages built by Serenity Package Factory.
            Point `/etc/spkg/repo.json` to:
            `https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/index.json`
          files: |
            build/packages/*.tar.zst
            build/packages/index.json
