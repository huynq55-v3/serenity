[package]
name = "clibrary"
version = "1.0.0"
arch = "x86_64-gnu"
description = "Common Linux C/C++ runtime libraries (NSS, NSPR, Cairo, Pango, ATK, X11, ALSA, CUPS, Kerberos, GLib) for Google Chrome & desktop apps"
deps = []

[source]
type = "syslibs"
patterns = [
    # Security, TLS & DNS resolution (required by Chrome HTTPS & networking)
    "libnss3.so*",
    "libnssutil3.so*",
    "libsmime3.so*",
    "libnssckbi.so*",
    "libsoftokn3.so*",
    "libfreeblpriv3.so*",
    "libnspr4.so*",
    "libplc4.so*",
    "libplds4.so*",
    "libnss_files.so*",
    "libnss_dns.so*",
    "libresolv.so*",
    # UI, 2D graphics, text shaping & accessibility
    "libcairo.so*",
    "libpango-1.0.so*",
    "libpangocairo-1.0.so*",
    "libharfbuzz.so*",
    "libatk-1.0.so*",
    "libatk-bridge-2.0.so*",
    "libatspi.so*",
    # X11 / XCB compatibility libraries (linked by Chrome even under Wayland)
    "libX11.so*",
    "libXcomposite.so*",
    "libXdamage.so*",
    "libXext.so*",
    "libXfixes.so*",
    "libXi.so*",
    "libXrandr.so*",
    "libXrender.so*",
    "libXRes.so*",
    "libxcb-render.so*",
    "libxcb-shm.so*",
    # Audio, printing, Kerberos & C++ runtime
    "libasound.so*",
    "libcups.so*",
    "libatomic.so*",
    "libstdc++.so*",
    "libkrb5.so*",
    "libgssapi_krb5.so*",
    "libk5crypto.so*",
    "libcom_err.so*",
    "libavahi-client.so*",
    "libavahi-common.so*",
]
