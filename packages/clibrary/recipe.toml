[package]
name = "clibrary"
version = "1.0.3"
arch = "x86_64-gnu"
description = "Common Linux C/C++ runtime libraries (GTK3 + GSettings schemas, NSS, NSPR, Cairo, Pango, ATK, X11, ALSA, CUPS, Kerberos, GLib) for Chrome, Antigravity & Electron apps"
deps = []

[source]
type = "syslibs"
extra_paths = [
    "/usr/share/glib-2.0/schemas/gschemas.compiled",
    "/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache",
    "/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders",
    "/usr/share/mime/mime.cache",
]
patterns = [
    # GTK 3 & Secret Service (required by Electron apps: Antigravity, VS Code, Discord)
    "libgtk-3.so*",
    "libgdk-3.so*",
    "libgdk_pixbuf-2.0.so*",
    "libepoxy.so*",
    "libsecret-1.so*",
    "libnotify.so*",
    # Security, TLS & DNS resolution (required by Chrome HTTPS & networking)
    "libnss3.so*",
    "libnssutil3.so*",
    "libsmime3.so*",
    "libnssckbi.so*",
    "libsoftokn3.so*",
    "libfreeblpriv3.so*",
    "libnspr4.so*",
    "libplc4.so*",
    "libplds4.so*",
    "libnss_files.so*",
    "libnss_dns.so*",
    "libresolv.so*",
    # UI, 2D graphics, text shaping & accessibility
    "libcairo.so*",
    "libpango-1.0.so*",
    "libpangocairo-1.0.so*",
    "libharfbuzz.so*",
    "libatk-1.0.so*",
    "libatk-bridge-2.0.so*",
    "libatspi.so*",
    # X11 / XCB compatibility libraries (linked by Chrome even under Wayland)
    "libX11.so*",
    "libXcomposite.so*",
    "libXdamage.so*",
    "libXext.so*",
    "libXfixes.so*",
    "libXi.so*",
    "libXrandr.so*",
    "libXrender.so*",
    "libXRes.so*",
    "libxcb-render.so*",
    "libxcb-shm.so*",
    # Audio, printing, Kerberos & C++ runtime
    "libasound.so*",
    "libcups.so*",
    "libatomic.so*",
    "libstdc++.so*",
    "libkrb5.so*",
    "libgssapi_krb5.so*",
    "libk5crypto.so*",
    "libcom_err.so*",
    "libavahi-client.so*",
    "libavahi-common.so*",
]
