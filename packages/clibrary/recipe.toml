[package]
name = "clibrary"
version = "1.0.8"
arch = "x86_64-gnu"
description = "Common Linux C/C++ runtime libraries (GTK3 + GSettings + Glycin/gdk-pixbuf + MIME, NSS, NSPR, Cairo, Pango, ATK, X11, ALSA, CUPS, Kerberos, GLib) for Chrome, Antigravity & Electron apps"
deps = []

[source]
type = "syslibs"
extra_paths = [
    "/usr/share/glib-2.0/schemas/gschemas.compiled",
    "/usr/share/glycin-loaders",
    "/usr/libexec/glycin-loaders",
    "/usr/bin/bwrap",
    "/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache",
    "/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders",
    "/usr/share/mime",
    "/usr/lib/locale/C.utf8",
    "/usr/lib/locale/en_US.utf8",
    "/usr/lib/locale/vi_VN.utf8",
    "/usr/lib/x86_64-linux-gnu/gconv",
    "/usr/bin/locale",
]
patterns = [
    # GTK 3 & Secret Service (required by Electron apps: Antigravity, VS Code, Discord)
    "libgtk-3.so*",
    "libgdk-3.so*",
    "libgdk_pixbuf-2.0.so*",
    "libepoxy.so*",
    "libsecret-1.so*",
    "libnotify.so*",
    # Security, TLS & DNS resolution (required by Chrome HTTPS & networking)
    "libnss3.so*",
    "libnssutil3.so*",
    "libsmime3.so*",
    "libnssckbi.so*",
    "libsoftokn3.so*",
    "libfreeblpriv3.so*",
    "libnspr4.so*",
    "libplc4.so*",
    "libplds4.so*",
    "libnss_files.so*",
    "libnss_dns.so*",
    "libresolv.so*",
    # UI, 2D graphics, text shaping & accessibility
    "libcairo.so*",
    "libpango-1.0.so*",
    "libpangocairo-1.0.so*",
    "libharfbuzz.so*",
    "libatk-1.0.so*",
    "libatk-bridge-2.0.so*",
    "libatspi.so*",
    # X11 / XCB / GLX OpenGL compatibility libraries (linked by Chrome, SteamRT & 64-bit games under Xwayland)
    "libGL.so*",
    "libGLX.so*",
    "libGLX_mesa.so*",
    "libGLX_indirect.so*",
    "libX11.so*",
    "libXcomposite.so*",
    "libXdamage.so*",
    "libXext.so*",
    "libXfixes.so*",
    "libXi.so*",
    "libXrandr.so*",
    "libXrender.so*",
    "libXRes.so*",
    "libXtst.so*",
    "libXxf86vm.so*",
    "libxcb-glx.so*",
    "libxcb-render.so*",
    "libxcb-shm.so*",
    # Wayland, XKB, GBM & UUID runtime (required by Alacritty, COSMIC apps & Mesa EGL)
    "libwayland-client.so*",
    "libwayland-cursor.so*",
    "libwayland-egl.so*",
    "libwayland-server.so*",
    "libxkbcommon.so*",
    "libgbm.so*",
    "libuuid.so*",
    # Audio, printing, Kerberos & C++ runtime
    "libasound.so*",
    "libcups.so*",
    "libatomic.so*",
    "libstdc++.so*",
    "libkrb5.so*",
    "libgssapi_krb5.so*",
    "libk5crypto.so*",
    "libcom_err.so*",
    "libavahi-client.so*",
    "libavahi-common.so*",
]
