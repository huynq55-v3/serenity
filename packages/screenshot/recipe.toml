[package]
name = "screenshot"
version = "2.0.0"
arch = "x86_64-gnu"
description = "Ubuntu-style Wayland Screenshot & Screen Recorder (PrintScreen HUD: Selection/Screen/Window, PNG + MP4 with PipeWire audio, grim/slurp/wl-clipboard)"
deps = ["serenity-base", "ffmpeg", "pipewire"]

[source]
type = "custom"
script = """
mkdir -p "${STAGE_DIR}/usr/bin"

echo "  -> Building serenity-capture (Ubuntu-style Screenshot & Screen Recorder)..."
(cd "${REPO_DIR}" && cargo build --release -p serenity-capture)
install -m 0755 "${REPO_DIR}/target/release/serenity-capture" "${STAGE_DIR}/usr/bin/serenity-capture"
ln -sfn /usr/bin/serenity-capture "${STAGE_DIR}/usr/bin/screen-recorder"

allowed=" libc.so.6 libm.so.6 libdl.so.2 librt.so.1 libpthread.so.0 libgcc_s.so.1 ld-linux-x86-64.so.2 "
for need in $(objdump -p "${STAGE_DIR}/usr/bin/serenity-capture" | awk '/NEEDED/ {print $2}'); do
    case "${allowed}" in
        *" ${need} "*) continue ;;
    esac
    echo "ERROR: serenity-capture needs ${need}, which Serenity base does not guarantee" >&2
    exit 1
done

copy_with_deps() {
    local bin="$1"
    local dst="$2"
    mkdir -p "$(dirname "${dst}")"
    cp -L "${bin}" "${dst}"
    chmod 0755 "${dst}"
    ldd "${bin}" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^\\//) print $i}' | sort -u | while read -r lib; do
        [ -f "${lib}" ] || continue
        case "$(basename "${lib}")" in
            ld-linux-*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*) continue ;;
        esac
        local ldst="${STAGE_DIR}${lib}"
        mkdir -p "$(dirname "${ldst}")"
        [ -e "${ldst}" ] || cp -L "${lib}" "${ldst}"
    done
}

# Build latest wayland-protocols (pure XML) so grim compiles with ext-image-copy-capture-v1
# support required by cosmic-comp (Ubuntu's packaged grim 1.4 only supports wlr-screencopy).
echo "  -> Installing latest wayland-protocols into temporary prefix..."
git clone --depth 1 https://gitlab.freedesktop.org/wayland/wayland-protocols.git "${WORK_DIR}/wayland-protocols"
meson setup "${WORK_DIR}/wayland-protocols/build" "${WORK_DIR}/wayland-protocols" \
    --prefix="${WORK_DIR}/wp-prefix" -Dtests=false
ninja -C "${WORK_DIR}/wayland-protocols/build" install

export PKG_CONFIG_PATH="${WORK_DIR}/wp-prefix/share/pkgconfig:${PKG_CONFIG_PATH:-}"

echo "  -> Building latest grim (with ext-image-copy-capture-v1 support)..."
git clone --depth 1 https://gitlab.freedesktop.org/emersion/grim.git "${WORK_DIR}/grim"
meson setup "${WORK_DIR}/grim/build" "${WORK_DIR}/grim" -Dman-pages=disabled
ninja -C "${WORK_DIR}/grim/build"
copy_with_deps "${WORK_DIR}/grim/build/grim" "${STAGE_DIR}/usr/bin/grim"

for tool in slurp wl-copy wl-paste; do
    BIN_PATH="$(command -v "${tool}" || true)"
    if [ -n "${BIN_PATH}" ] && [ -x "${BIN_PATH}" ]; then
        copy_with_deps "${BIN_PATH}" "${STAGE_DIR}/usr/bin/${tool}"
    else
        echo "ERROR: Missing required tool '${tool}' on build host" >&2
        exit 1
    fi
done

"${STAGE_DIR}/usr/bin/serenity-capture" --version
"${STAGE_DIR}/usr/bin/serenity-capture" --help | grep -qi "screen"
test -x "${STAGE_DIR}/usr/bin/grim" && test -x "${STAGE_DIR}/usr/bin/slurp" && test -x "${STAGE_DIR}/usr/bin/wl-copy"
"""

[install.scripts]
"usr/bin/screenshot" = """#!/bin/sh
set -eu

if [ "$#" -eq 0 ]; then
    exec /usr/bin/serenity-capture
fi

case "$1" in
    -f|--full|--interactive=false)
        shift
        exec /usr/bin/serenity-capture --full "$@"
        ;;
    -r|--region|--area|--interactive=true)
        shift
        exec /usr/bin/serenity-capture --region "$@"
        ;;
    -R|--record)
        shift
        exec /usr/bin/serenity-capture --record "$@"
        ;;
    --stop|--status)
        exec /usr/bin/serenity-capture "$@"
        ;;
    *)
        exec /usr/bin/serenity-capture "$@"
        ;;
esac
"""

"usr/bin/cosmic-screenshot" = """#!/bin/sh
for arg in "$@"; do
    case "$arg" in
        --interactive=false)
            exec /usr/bin/serenity-capture --full
            ;;
    esac
done
exec /usr/bin/serenity-capture "$@"
"""

[install.inline]
"usr/share/icons/hicolor/scalable/apps/serenity-capture.svg" = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#22242A"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M16 24V18a2 2 0 0 1 2-2h6M40 16h6a2 2 0 0 1 2 2v6M48 40v6a2 2 0 0 1-2 2h-6M24 48h-6a2 2 0 0 1-2-2v-6"
        fill="none" stroke="#F6F7FA" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="9" fill="#3584E4"/>
  <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
  <circle cx="48" cy="18" r="5" fill="#E01B24"/>
</svg>
"""

"usr/share/icons/hicolor/scalable/apps/serenity-recorder.svg" = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#24191C"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#E01B24" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="14" y="21" width="24" height="22" rx="5" fill="#F6F7FA"/>
  <path d="M40 27l10-6v22l-10-6z" fill="#F6F7FA"/>
  <circle cx="26" cy="32" r="6" fill="#E01B24"/>
</svg>
"""

"usr/share/applications/screenshot.desktop" = """[Desktop Entry]
Version=1.0
Name=Screenshot & Screen Recorder
GenericName=Screen Capture
Comment=Ubuntu-style screenshot and screen recording overlay
Exec=/usr/bin/serenity-capture
Terminal=false
Icon=serenity-capture
StartupNotify=true
StartupWMClass=serenity-capture
Type=Application
Categories=Utility;Graphics;AudioVideo;
Keywords=screenshot;screen;recorder;screencast;video;capture;
Actions=RecordScreen;FullScreen;StopRecording;

[Desktop Action RecordScreen]
Name=Record Screen
Exec=/usr/bin/serenity-capture --record

[Desktop Action FullScreen]
Name=Capture Full Screen
Exec=/usr/bin/serenity-capture --full

[Desktop Action StopRecording]
Name=Stop Active Recording
Exec=/usr/bin/serenity-capture --stop
"""

"usr/share/applications/screen-recorder.desktop" = """[Desktop Entry]
Version=1.0
Name=Screen Recorder
GenericName=Wayland Screen Recorder
Comment=Record desktop, region, or window video with PipeWire audio
Exec=/usr/bin/serenity-capture --record
Terminal=false
Icon=serenity-recorder
StartupNotify=true
StartupWMClass=serenity-capture
Type=Application
Categories=AudioVideo;Video;Recorder;Utility;
Keywords=record;screencast;video;screen;capture;mp4;
Actions=RecordFullScreen;StopRecording;

[Desktop Action RecordFullScreen]
Name=Record Full Screen Now
Exec=/usr/bin/serenity-capture --record-full

[Desktop Action StopRecording]
Name=Stop Active Recording
Exec=/usr/bin/serenity-capture --stop
"""
