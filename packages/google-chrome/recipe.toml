[package]
name = "google-chrome"
version = "stable-r3"
arch = "x86_64-gnu"
description = "Google Chrome web browser (repacked from official .deb, Wayland native + full sandbox)"
deps = ["clibrary"]

[source]
type = "deb"
url = "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"

[install]
# Strip Debian/Ubuntu apt & cron integration files not used on Serenity
remove = [
    "etc/cron.daily",
    "usr/share/menu",
    "usr/share/doc",
    "usr/share/man",
]

[install.assets]
"opt/google/chrome/product_logo_128.png" = "usr/share/icons/hicolor/128x128/apps/google-chrome.png"
"opt/google/chrome/product_logo_256.png" = "usr/share/icons/hicolor/256x256/apps/google-chrome.png"

[install.scripts]
"usr/bin/google-chrome" = """#!/bin/sh
EXTRA_FLAGS=""
# Auto-disable GPU compositing only under virtual QEMU virtio-gpu (which lacks dmabuf create_immed);
# bare-metal GPUs (Intel i915/iris, AMD, etc.) use full hardware acceleration.
for drv in /sys/class/drm/card*/device/driver; do
    if [ -L "$drv" ]; then
        case "$(readlink "$drv")" in
            *virtio*) EXTRA_FLAGS="--disable-gpu --disable-gpu-compositing" ;;
        esac
    fi
done
exec /opt/google/chrome/chrome --ozone-platform-hint=auto --ozone-platform=wayland $EXTRA_FLAGS "$@"
"""

[install.inline]
"usr/share/applications/google-chrome.desktop" = """[Desktop Entry]
Version=1.0
Name=Google Chrome
GenericName=Web Browser
Comment=Access the Internet
Exec=/usr/bin/google-chrome %U
StartupNotify=true
StartupWMClass=google-chrome
Terminal=false
Icon=google-chrome
Type=Application
Categories=Network;WebBrowser;
MimeType=text/html;text/xml;application/xhtml_xml;x-scheme-handler/http;x-scheme-handler/https;
"""
