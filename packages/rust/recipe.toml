[package]
name = "rust"
version = "1.100.0-r1"
arch = "x86_64-gnu"
description = "Rust compiler (rustc) + Cargo (x86_64 GNU + musl) with self-contained clang/lld/llvm-ar & musl headers"
deps = ["clibrary"]

[source]
type = "custom"
script = """
RUST_VER="${PKG_VERSION%%-*}"
TARGET="x86_64-unknown-linux-gnu"
BASE="https://static.rust-lang.org/dist"

mkdir -p "${WORK_DIR}/dl" "${STAGE_DIR}/usr"

for comp in \
    "rustc-${RUST_VER}-${TARGET}" \
    "cargo-${RUST_VER}-${TARGET}" \
    "rust-std-${RUST_VER}-${TARGET}" \
    "rust-std-${RUST_VER}-x86_64-unknown-linux-musl"; do
    echo "  -> Downloading ${comp}.tar.xz..."
    curl -fsSL "${BASE}/${comp}.tar.xz" -o "${WORK_DIR}/dl/${comp}.tar.xz"
    tar -xf "${WORK_DIR}/dl/${comp}.tar.xz" -C "${WORK_DIR}"
    "${WORK_DIR}/${comp}/install.sh" \
        --prefix="${STAGE_DIR}/usr" \
        --without=rust-docs \
        --disable-ldconfig
done

# Remove uninstall metadata & docs to keep the spkg archive lean
rm -rf "${STAGE_DIR}/usr/lib/rustlib/uninstall.sh" \
       "${STAGE_DIR}/usr/lib/rustlib/install.log" \
       "${STAGE_DIR}/usr/lib/rustlib/manifest-"* \
       "${STAGE_DIR}/usr/share/doc" \
       "${STAGE_DIR}/usr/share/man"

# Bundle minimal GNU C linker driver (clang + lld) + glibc/libgcc CRT objects so
# `cargo build` / `cargo run` can link x86_64-unknown-linux-gnu binaries out-of-the-box!
copy_bin_and_deps() {
    local bin="$1"
    local dst="$2"
    mkdir -p "$(dirname "${dst}")"
    cp -L "${bin}" "${dst}"
    chmod 0755 "${dst}"
    ldd "${bin}" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^\\//) print $i}' | sort -u | while read -r lib; do
        [ -f "${lib}" ] || continue
        case "$(basename "${lib}")" in
            ld-linux-*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*) continue ;;
        esac
        local norm="${lib}"
        case "${norm}" in
            /lib/x86_64-linux-gnu/*) norm="/usr${norm}" ;;
        esac
        local ldst="${STAGE_DIR}${norm}"
        mkdir -p "$(dirname "${ldst}")"
        [ -e "${ldst}" ] || cp -L "${lib}" "${ldst}"
    done
}

CLANG_BIN="$(command -v clang)"
LLD_BIN="$(command -v ld.lld || command -v lld)"
LLVM_AR_BIN="$(command -v llvm-ar || ls /usr/bin/llvm-ar-* 2>/dev/null | head -n 1 || true)"
if [ -z "${LLVM_AR_BIN}" ]; then
    echo "ERROR: llvm-ar not found on build host" >&2
    exit 1
fi
copy_bin_and_deps "${CLANG_BIN}" "${STAGE_DIR}/usr/bin/clang"
copy_bin_and_deps "${LLD_BIN}" "${STAGE_DIR}/usr/bin/ld.lld"
copy_bin_and_deps "${LLVM_AR_BIN}" "${STAGE_DIR}/usr/bin/llvm-ar"
ln -sf clang "${STAGE_DIR}/usr/bin/cc"
ln -sf ld.lld "${STAGE_DIR}/usr/bin/ld"
ln -sf llvm-ar "${STAGE_DIR}/usr/bin/ar"

# Copy Clang builtin headers + musl headers/libs so x86_64-unknown-linux-musl builds C/ASM crates (e.g. ring)
CLANG_RES="$(clang -print-resource-dir)"
CLANG_MAJOR="$(basename "${CLANG_RES}")"
mkdir -p "${STAGE_DIR}/usr/lib/clang/${CLANG_MAJOR}"
cp -rL "${CLANG_RES}/include" "${STAGE_DIR}/usr/lib/clang/${CLANG_MAJOR}/"
mkdir -p "${STAGE_DIR}/usr/include" "${STAGE_DIR}/usr/lib"
cp -rL /usr/include/x86_64-linux-musl "${STAGE_DIR}/usr/include/"
cp -rL /usr/lib/x86_64-linux-musl "${STAGE_DIR}/usr/lib/"

# Copy CRT startup objects & glibc/libgcc linker scripts needed for linking GNU ELF binaries
mkdir -p "${STAGE_DIR}/usr/lib/x86_64-linux-gnu"
for f in crt1.o Scrt1.o crti.o crtn.o libc.so libc_nonshared.a libm.so libmvec.so libpthread.a libdl.a librt.a libutil.a; do
    if [ -e "/usr/lib/x86_64-linux-gnu/${f}" ]; then
        cp -a "/usr/lib/x86_64-linux-gnu/${f}" "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/"
    fi
done
if [ -e /usr/lib/x86_64-linux-gnu/libmvec.so.1 ]; then
    cp -L /usr/lib/x86_64-linux-gnu/libmvec.so.1 "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/"
fi
cat > "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libc.so" <<'EOF'
/* GNU ld script */
OUTPUT_FORMAT(elf64-x86-64)
GROUP ( /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/lib/x86_64-linux-gnu/libc_nonshared.a AS_NEEDED ( /lib64/ld-linux-x86-64.so.2 ) )
EOF
cat > "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libm.so" <<'EOF'
/* GNU ld script */
OUTPUT_FORMAT(elf64-x86-64)
GROUP ( /usr/lib/x86_64-linux-gnu/libm.so.6 AS_NEEDED ( /usr/lib/x86_64-linux-gnu/libmvec.so.1 ) )
EOF

# Copy GCC CRT objects & libgcc static/shared archives (clang uses them automatically to link)
GCC_DIR="$(dirname "$(gcc -print-libgcc-file-name)")"
mkdir -p "${STAGE_DIR}${GCC_DIR}"
for f in crtbegin.o crtbeginS.o crtbeginT.o crtend.o crtendS.o libgcc.a libgcc_eh.a libgcc_s.so libgcc_s.so.1; do
    if [ -e "${GCC_DIR}/${f}" ]; then
        cp -a "${GCC_DIR}/${f}" "${STAGE_DIR}${GCC_DIR}/"
    fi
done

# Ensure libgcc_s.so.1 is present in /usr/lib/x86_64-linux-gnu as well
if [ -e /usr/lib/x86_64-linux-gnu/libgcc_s.so.1 ]; then
    cp -a /usr/lib/x86_64-linux-gnu/libgcc_s.so.1 "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/"
fi

test -d "${STAGE_DIR}/usr/lib/rustlib/x86_64-unknown-linux-musl/lib"
test -x "${STAGE_DIR}/usr/bin/llvm-ar"
test -f "${STAGE_DIR}/usr/include/x86_64-linux-musl/sys/auxv.h"
test -f "${STAGE_DIR}/usr/lib/clang/${CLANG_MAJOR}/include/stddef.h"
test -f "${STAGE_DIR}/usr/lib/clang/${CLANG_MAJOR}/include/immintrin.h"
grep -q ' /usr/lib/x86_64-linux-gnu/libc.so.6 ' "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libc.so"
grep -q ' /usr/lib/x86_64-linux-gnu/libm.so.6 ' "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libm.so"
! grep -q ' /lib/x86_64-linux-gnu/' "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libc.so"
! grep -q ' /lib/x86_64-linux-gnu/' "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libm.so"
! grep -q '/usr/usr/' "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libc.so"
! grep -q '/usr/usr/' "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libm.so"
test -f "${STAGE_DIR}/usr/lib/x86_64-linux-gnu/libmvec.so.1"
"""

[install.scripts]
"usr/bin/musl-cc" = """#!/bin/sh
exec /usr/bin/clang --target=x86_64-unknown-linux-musl -isystem /usr/include/x86_64-linux-musl "$@"
"""

[install.inline]
"etc/cargo/config.toml" = """[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
CC_x86_64_unknown_linux_musl = { value = "/usr/bin/musl-cc", force = false }
AR_x86_64_unknown_linux_musl = { value = "/usr/bin/llvm-ar", force = false }
"""
