[package]
name = "cosmic-desktop"
version = "0.1.0"
arch = "any"
description = "Serenity COSMIC Desktop meta-package (Smithay + Dock + Applets + Launcher + App Library)"
deps = [
    "cosmic-comp",
    "cosmic-settings-daemon",
    "cosmic-panel",
    "cosmic-applets",
    "cosmic-bg",
    "cosmic-launcher",
    "cosmic-app-library",
    "cosmic-session",
]

[source]
type = "meta"

[install.inline]
# Default COSMIC Dock favorites (install extra apps like `spkg install alacritty` anytime)
"usr/share/cosmic/com.system76.CosmicAppList/v1/favorites" = """[
    "com.system76.CosmicAppLibrary",
]
"""
