[package]
name = "serenity-shell"
version = "0.1.0"
edition = "2021"
description = "Serenity Linux Standalone Login Greeter & macOS-style Desktop Shell (iced + Wayland)"

[lib]
name = "serenity_ui"
path = "src/lib.rs"

[[bin]]
name = "serenity-login"
path = "src/bin/login.rs"

[[bin]]
name = "serenity-shell"
path = "src/bin/desktop.rs"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia"] }
