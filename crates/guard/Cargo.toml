[package]
name = "serenity-guard"
version = "0.1.0"
edition = "2021"
description = "Serenity Linux real-time HIDS/IPS security daemon, SOC Web Dashboard, and AI/MCP defense engine"

[[bin]]
name = "serenity-guard"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
