<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Grant the primary desktop user 'serenity' access only to desktop-required
       System D-Bus services. wpa_supplicant remains root/NetworkManager-only. -->
  <policy user="serenity">
    <allow send_destination="org.freedesktop.login1"/>
    <allow send_destination="org.freedesktop.UPower"/>
    <allow send_destination="org.freedesktop.timedate1"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
