<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Serenity Linux default Roboto UI/sans-serif, Noto Symbols/Math, and Noto Color Emoji configuration</description>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans Symbols2</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Roboto</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <accept>
      <family>Noto Sans Symbols2</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Sans Symbols2</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Sans Symbols2</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>DejaVu Sans Mono</family>
    <accept>
      <family>Noto Sans Symbols2</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>Roboto</family>
    <accept>
      <family>Noto Sans Symbols2</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias binding="same"><family>Arial</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Verdana</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Noto Sans</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Noto Sans UI</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Ubuntu</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Cantarell</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Liberation Sans</family><accept><family>Roboto</family></accept></alias>
  <alias binding="same"><family>Arimo</family><accept><family>Roboto</family></accept></alias>
</fontconfig>
