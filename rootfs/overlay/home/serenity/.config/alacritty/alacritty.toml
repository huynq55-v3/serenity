# Serenity Linux default Alacritty configuration

[selection]
# Automatically copy highlighted text to system clipboard (no need to press Ctrl+Shift+C)
save_to_clipboard = true

[mouse]
bindings = [
  # Right-click pastes directly from system clipboard
  { mouse = "Right", action = "Paste" },
  { mouse = "Middle", action = "PasteSelection" },
]

[font]
size = 11.5

[font.normal]
family = "DejaVu Sans Mono"

[window]
padding = { x = 8, y = 8 }
decorations = "Full"
